# Sobreposição do compose oficial (upstream/taiga-docker): fixa versões e define padrões da Vetor Sistemas.
# Caminhos relativos resolvem a partir de upstream/taiga-docker (diretório do primeiro arquivo -f).
# Backend oficial + app Django da Vetor (vetor-back/). Montagem somente leitura não serve:
# o entrypoint oficial faz chown -R em /taiga-back.
x-vetor-back-image: &vetor-back-image
  image: vetor/taiga-back:6.10.2-vetor
  build:
    context: ../..
    dockerfile: vetor-back/Dockerfile

x-vetor-back-environment: &vetor-back-environment
  LANGUAGE_CODE: "pt-br"
  VETOR_SOURCE_URL: "${VETOR_SOURCE_URL}"
  VETOR_DOCUMENTO_MAX_MB: "${VETOR_DOCUMENTO_MAX_MB:-25}"
  VETOR_SISTEMA_FINANCEIRO_NOME: "${VETOR_SISTEMA_FINANCEIRO_NOME:-}"
  VETOR_SISTEMA_FINANCEIRO_URL: "${VETOR_SISTEMA_FINANCEIRO_URL:-}"
  VETOR_GITHUB_WEBHOOK_SECRET: "${VETOR_GITHUB_WEBHOOK_SECRET:-}"
  VETOR_GITHUB_WEBHOOK_SECRET_ANTERIOR: "${VETOR_GITHUB_WEBHOOK_SECRET_ANTERIOR:-}"
  VETOR_KUMA_TOKEN: "${VETOR_KUMA_TOKEN:-}"
  VETOR_KUMA_TOKEN_ANTERIOR: "${VETOR_KUMA_TOKEN_ANTERIOR:-}"
  VETOR_BESZEL_TOKEN: "${VETOR_BESZEL_TOKEN:-}"
  VETOR_BESZEL_TOKEN_ANTERIOR: "${VETOR_BESZEL_TOKEN_ANTERIOR:-}"
  VETOR_MONITOR_JANELA_MIN: "${VETOR_MONITOR_JANELA_MIN:-15}"
  VETOR_MONITOR_AVISO_MIN: "${VETOR_MONITOR_AVISO_MIN:-30}"
  VETOR_MONITOR_RETENCAO_DIAS: "${VETOR_MONITOR_RETENCAO_DIAS:-90}"
  CELERY_TIMEZONE: "America/Sao_Paulo"
  PUBLIC_REGISTER_ENABLED: "False"
  SESSION_COOKIE_SECURE: "${COOKIES_SECURE}"
  CSRF_COOKIE_SECURE: "${COOKIES_SECURE}"

services:
  taiga-db:
    image: postgres:12.3@sha256:a06e6e6e519b7a329c419f8221edec66cfc45511e8b80e262c12103ba745cf19
  taiga-back:
    <<: *vetor-back-image
    environment: *vetor-back-environment
  taiga-async:
    <<: *vetor-back-image
    environment: *vetor-back-environment
  taiga-front:
    # Front oficial com a marca aplicada no build (vetor-front/). O contexto é a raiz do repositório.
    image: vetor/taiga-front:6.10.3-vetor
    build:
      context: ../..
      dockerfile: vetor-front/Dockerfile
    environment:
      DEFAULT_LANGUAGE: "pt-br"
      PUBLIC_REGISTER_ENABLED: "false"
      VETOR_SOURCE_URL: "${VETOR_SOURCE_URL}"
  taiga-events:
    # Oficial + autorização das assinaturas do WebSocket (vetor-events/).
    image: vetor/taiga-events:6.10.0-vetor
    build:
      context: ../..
      dockerfile: vetor-events/Dockerfile
  taiga-protected:
    # Oficial + exportações de projeto com token assinado (vetor-protected/).
    image: vetor/taiga-protected:6.10.1-vetor
    build:
      context: ../..
      dockerfile: vetor-protected/Dockerfile
  taiga-async-rabbitmq:
    image: rabbitmq:3.8-management-alpine@sha256:c3e526769bfd885c898d1132e1008b216800e8543619c30d5959b220285564ef
  taiga-events-rabbitmq:
    image: rabbitmq:3.8-management-alpine@sha256:c3e526769bfd885c898d1132e1008b216800e8543619c30d5959b220285564ef
  taiga-gateway:
    image: nginx:1.19-alpine@sha256:07ab71a2c8e4ecb19a5a5abcfb3a4f175946c001c8af288b1aa766d67b0d05d2
    ports: !override
      - "${VETOR_HTTP_PORT}:80"
    volumes:
      - ../../infra/taiga-gateway.conf:/etc/nginx/conf.d/default.conf:ro
  taiga-manage:
    <<: *vetor-back-image
    environment: *vetor-back-environment
