# Sobreposição do compose oficial (upstream/taiga-docker): fixa versões e define padrões da Vetor Sistemas.
# Caminhos relativos resolvem a partir de upstream/taiga-docker (diretório do primeiro arquivo -f).
# Backend oficial + app Django da Vetor (vetor-back/). Montagem somente leitura não serve:
# o entrypoint oficial faz chown -R em /taiga-back.
x-vetor-back-image: &vetor-back-image
  image: vetor/taiga-back:6.10.2-vetor
  build:
    context: ../..
    dockerfile: vetor-back/Dockerfile

x-vetor-back-environment: &vetor-back-environment
  LANGUAGE_CODE: "pt-br"
  VETOR_SOURCE_URL: "${VETOR_SOURCE_URL}"
  CELERY_TIMEZONE: "America/Sao_Paulo"
  PUBLIC_REGISTER_ENABLED: "False"
  SESSION_COOKIE_SECURE: "${COOKIES_SECURE}"
  CSRF_COOKIE_SECURE: "${COOKIES_SECURE}"

services:
  taiga-db:
    image: postgres:12.3@sha256:a06e6e6e519b7a329c419f8221edec66cfc45511e8b80e262c12103ba745cf19
  taiga-back:
    <<: *vetor-back-image
    environment: *vetor-back-environment
  taiga-async:
    <<: *vetor-back-image
    environment: *vetor-back-environment
  taiga-front:
    # Front oficial com a marca aplicada no build (vetor-front/). O contexto é a raiz do repositório.
    image: vetor/taiga-front:6.10.3-vetor
    build:
      context: ../..
      dockerfile: vetor-front/Dockerfile
    environment:
      DEFAULT_LANGUAGE: "pt-br"
      PUBLIC_REGISTER_ENABLED: "false"
      VETOR_SOURCE_URL: "${VETOR_SOURCE_URL}"
  taiga-events:
    image: taigaio/taiga-events:6.10.0@sha256:92fc0822564f891700d74d23fa44951adf2845cf50c9e56bfd0ef29abdc1ab40
  taiga-protected:
    image: taigaio/taiga-protected:6.10.1@sha256:fd4568a97a59225db90f422594cf0e05010be50c9a2a383c01477c5ee521d393
  taiga-async-rabbitmq:
    image: rabbitmq:3.8-management-alpine@sha256:c3e526769bfd885c898d1132e1008b216800e8543619c30d5959b220285564ef
  taiga-events-rabbitmq:
    image: rabbitmq:3.8-management-alpine@sha256:c3e526769bfd885c898d1132e1008b216800e8543619c30d5959b220285564ef
  taiga-gateway:
    image: nginx:1.19-alpine@sha256:07ab71a2c8e4ecb19a5a5abcfb3a4f175946c001c8af288b1aa766d67b0d05d2
    ports: !override
      - "${VETOR_HTTP_PORT}:80"
  taiga-manage:
    <<: *vetor-back-image
    environment: *vetor-back-environment
